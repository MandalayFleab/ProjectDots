server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Godot's exported filenames never change between builds, so without this
	# browsers can keep serving a stale cached index.wasm/.pck across deploys.
	location ~* \.(html|wasm|pck|js)$ {
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
